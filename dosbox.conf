# dosbox.conf - Laboratorio U5 (Alferez-post1-u5)
# Para las corridas del Paso 7 se cambia unicamente la linea "cycles" y se reinicia DOSBox.
# Valores usados: 8000 (corrida 1, valor final), 1000 (corrida 2) y 20000 (corrida 3).

[cpu]
core=normal
cputype=auto
cycles=8000

[dosbox]
memsize=16

[render]
scaler=normal2x

[autoexec]
# AJUSTAR la ruta al directorio real del proyecto en el sistema anfitrion.
mount c "C:\Users\diego\OneDrive\Documentos\UFPS\Arquitectura de Computadores\Unidad 5\Alferez-post1-u5"
c:
# CWSDPMI es el host DPMI que necesita nasm.exe (version DOS de 32 bits).
cwsdpmi
cls
echo DOSBox listo. Directorio de trabajo: C:\
